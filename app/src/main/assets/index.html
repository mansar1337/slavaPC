<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#07080d">
<title>Куманцов ПК .ru</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<div class="bg"><span class="blob b1"></span><span class="blob b2"></span><span class="blob b3"></span><span class="grid"></span></div>

<header class="topbar" id="topbar">
  <a class="logo" href="#/home">
    <span class="logo-mark">K</span>
    <span class="logo-text">Куманцов<b>ПК</b><i>.ru</i></span>
  </a>
  <div class="topbar-actions">
    <button class="icon-btn" id="btn-search" aria-label="Поиск">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.6-3.6"/></svg>
    </button>
    <a class="icon-btn" href="#/favorites" aria-label="Избранное" id="fav-btn">
      <svg viewBox="0 0 24 24"><path d="M12 20s-7-4.6-7-9.3A4.2 4.2 0 0 1 12 8a4.2 4.2 0 0 1 7 2.7C19 15.4 12 20 12 20z"/></svg>
      <span class="badge" id="fav-badge" hidden>0</span>
    </a>
    <a class="icon-btn" href="#/cart" aria-label="Корзина">
      <svg viewBox="0 0 24 24"><path d="M3 4h2.2l2.2 11h9.6l2-8H6"/><circle cx="10" cy="19" r="1.4"/><circle cx="17" cy="19" r="1.4"/></svg>
      <span class="badge" id="cart-badge" hidden>0</span>
    </a>
  </div>
</header>

<div class="searchbar" id="searchbar" hidden>
  <svg viewBox="0 0 24 24" class="s-ico"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.6-3.6"/></svg>
  <input id="search-input" type="search" placeholder="Поиск по каталогу…" autocomplete="off">
  <button class="s-close" id="search-close" aria-label="Закрыть">✕</button>
</div>

<main id="view" class="view"></main>

<nav class="tabbar">
  <a class="tab" href="#/home" data-tab="home"><svg viewBox="0 0 24 24"><path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z"/></svg><span>Главная</span></a>
  <a class="tab" href="#/catalog" data-tab="catalog"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.5"/></svg><span>Каталог</span></a>
  <a class="tab" href="#/configurator" data-tab="configurator"><svg viewBox="0 0 24 24"><path d="M12 3v4M12 17v4M3 12h4M17 12h4M5.6 5.6l2.8 2.8M15.6 15.6l2.8 2.8M18.4 5.6l-2.8 2.8M8.4 15.6l-2.8 2.8"/><circle cx="12" cy="12" r="3.4"/></svg><span>Сборка</span></a>
  <a class="tab" href="#/cart" data-tab="cart"><svg viewBox="0 0 24 24"><path d="M3 4h2.2l2.2 11h9.6l2-8H6"/><circle cx="10" cy="19" r="1.4"/><circle cx="17" cy="19" r="1.4"/></svg><span>Корзина</span></a>
  <a class="tab" href="#/contacts" data-tab="contacts"><svg viewBox="0 0 24 24"><path d="M6.5 3h3l1.5 4-2 1.5a12 12 0 0 0 5.5 5.5L16 12l4 1.5v3A2.5 2.5 0 0 1 17.5 21C10 21 3 14 3 6.5A2.5 2.5 0 0 1 5.5 4z"/></svg><span>Контакты</span></a>
</nav>

<div class="toast-wrap" id="toast-wrap"></div>

<div class="sheet-backdrop" id="sheet-backdrop" hidden></div>
<div class="sheet" id="sheet" hidden>
  <div class="sheet-grip"></div>
  <div id="sheet-body"></div>
</div>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
</body>
</html>
